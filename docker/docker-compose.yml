version: "3.5"
name: "datarepo"

services:
  cache:
    image: redis:7
    restart: "unless-stopped"
    read_only: true
    ports:
      - "${INVENIO_REDIS_HOST}:${INVENIO_REDIS_PORT}:6379"
  db:
    image: postgres:18-alpine
    restart: "unless-stopped"
    environment:
      - "POSTGRES_USER=${INVENIO_DATABASE_USER}"
      - "POSTGRES_PASSWORD=${INVENIO_DATABASE_PASSWORD}"
      - "POSTGRES_DB=${INVENIO_DATABASE_DBNAME}"
    ports:
      - "${INVENIO_DATABASE_HOST}:${INVENIO_DATABASE_PORT}:5432"
  mq:
    image: rabbitmq:3-management
    restart: "unless-stopped"
    environment:
      RABBITMQ_DEFAULT_USER: "${INVENIO_RABBIT_USER}"
      RABBITMQ_DEFAULT_PASS: "${INVENIO_RABBIT_PASSWORD}"
    ports:
      - "${INVENIO_RABBIT_HOST}:${INVENIO_RABBIT_ADMIN_PORT}:15672"
      - "${INVENIO_RABBIT_HOST}:${INVENIO_RABBIT_PORT}:5672"

  search:
    image: opensearchproject/opensearch:3
    restart: "unless-stopped"
    environment:
      # settings only for development. DO NOT use in production!
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - "DISABLE_INSTALL_DEMO_CONFIG=true"
      - "DISABLE_SECURITY_PLUGIN=true"
      - "discovery.type=single-node"
      - OPENSEARCH_PLUGINS=analysis-icu
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    mem_limit: 2g
    ports:
      - "${INVENIO_OPENSEARCH_HOST}:${INVENIO_OPENSEARCH_PORT}:9200"
      - "${INVENIO_OPENSEARCH_HOST}:${INVENIO_OPENSEARCH_CLUSTER_PORT}:9600"
  s3:
    # minio/minio images are no longer published on Docker Hub; RustFS is the S3 server
    # used by oarepo-cli's own test services (docker-services-cli)
    image: rustfs/rustfs:1.0.0
    restart: "unless-stopped"
    environment:
      RUSTFS_ACCESS_KEY: ${INVENIO_S3_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${INVENIO_S3_SECRET_KEY}
      RUSTFS_ADDRESS: "0.0.0.0:9000"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: "0.0.0.0:9001"
      RUSTFS_VOLUMES: "/data"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 10s
      timeout: 5s
      retries: 6
    ports:
      - "${INVENIO_S3_HOST}:${INVENIO_S3_PORT}:9000"
      - "${INVENIO_S3_HOST}:${INVENIO_S3_PORT1}:9001"
  s3-init:
    # RustFS does not create buckets on its own and "invenio s3 create-bucket" is missing in
    # invenio-s3 < 6, so create the "default" bucket of the default files location here (idempotent)
    image: rustfs/rustfs:1.0.0
    restart: "no"
    depends_on:
      s3:
        condition: service_healthy
    environment:
      S3_ACCESS_KEY: ${INVENIO_S3_ACCESS_KEY}
      S3_SECRET_KEY: ${INVENIO_S3_SECRET_KEY}
    entrypoint:
      - sh
      - -c
      - >-
        curl -sf --aws-sigv4 "aws:amz:us-east-1:s3" --user "$$S3_ACCESS_KEY:$$S3_SECRET_KEY"
        -X PUT http://s3:9000/default -o /dev/null && echo "bucket default ready"
